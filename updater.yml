name: Auto Status Updater

on:
  schedule:
    - cron: '*/5 * * * *' # Runs every 5 minutes
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-status:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate fresh status
        run: |
          date_iso=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          next_iso=$(date -u -d "+5 minutes" +"%Y-%m-%dT%H:%M:%SZ")
          
          # Update status.json with current live timestamps
          cat <<EOF > status.json
          {
            "state": "running",
            "interval_minutes": 5,
            "align_offset_seconds": 20,
            "tz": "Asia/Dubai",
            "next_run_at": "$next_iso",
            "updated_at": "$date_iso",
            "last_cycle_started_at": "$date_iso",
            "last_cycle_finished_at": "$date_iso"
          }
          EOF

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add status.json
          git commit -m "Auto-update status heartbeat [skip ci]" || exit 0
          git push
