name: Gemini Vision Engine

on:
  schedule:
    - cron: '* * * * *'
  workflow_dispatch:

jobs:
  analyze-chart:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install google-generativeai pillow

      - name: Run Gemini Vision script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python gemini_vision_runner.py

      - name: Commit and Push results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add latest_signal.json history.json
          git commit -m "Automated Gemini Signal Update" || echo "No changes to commit"
          git push
