name: Auto Status Updater

on:
  schedule:
    - cron: '* * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-status:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate fresh status
        run: |
          date_iso=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          next_iso=$(date -u -d "+1 minute" +"%Y-%m-%dT%H:%M:%SZ")
          
          cat <<EOF > status.json
          {
            "state": "running",
            "interval_minutes": 1,
            "align_offset_seconds": 0,
            "tz": "Asia/Dubai",
            "next_run_at": "$next_iso",
            "updated_at": "$date_iso",
            "last_cycle_started_at": "$date_iso",
            "last_cycle_finished_at": "$date_iso"
          }
          EOF

      - name: Append to History Log
        run: |
          # Create history.json if it doesn't exist yet
          [ ! -f history.json ] && echo "[]" > history.json
          
          # If a new signal exists, append it to history.json using a temp file
          if [ -f latest_signal.json ]; then
            jq --slurp '.[0] + [.[1]]' history.json latest_signal.json > tmp.json && mv tmp.json history.json
          fi

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add status.json history.json
          git commit -m "Auto-update status and log history [skip ci]" || exit 0
          git push
