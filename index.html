<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1117">
<title>Signals</title>
<style>
  :root {
    --bg: #0E1117; --fg: #E6EDF3; --muted: #7D8590; --faint: #3B424C; --line: #1C2129;
    --buy: #26A69A; --sell: #EF5350; --amber: #F5A524;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    --sans: Inter, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--fg); font-family: var(--sans);
               -webkit-font-smoothing: antialiased; }
  body { display: flex; flex-direction: column; min-height: 100dvh; padding: 28px 24px 20px; }
  header { display: flex; justify-content: flex-end; align-items: center; font-size: 12px;
           letter-spacing: .22em; text-transform: uppercase; color: var(--muted); }
  .state { display: inline-flex; align-items: center; gap: 8px; letter-spacing: .16em; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--buy); }
  .state.paused .dot { background: var(--amber); }
  .state.paused { color: var(--amber); }
  .state.live .dot { animation: pulse 2.4s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .25; } }
  main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
         width: 100%; max-width: 520px; margin: 0 auto; padding: 40px 0; }
  .view { width: 100%; display: none; flex-direction: column; align-items: center; text-align: center;
          animation: fade .5s ease; }
  .view.on { display: flex; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .eyebrow { font-size: 13px; letter-spacing: .24em; text-transform: uppercase; color: var(--muted); }
  .count { font-family: var(--mono); font-variant-numeric: tabular-nums; font-weight: 300;
           font-size: clamp(88px, 27vw, 176px); line-height: 1; letter-spacing: -.04em; margin: 22px 0 18px; }
  .sub { font-size: 15px; color: var(--muted); }
  .analyzing { font-size: clamp(34px, 9vw, 52px); font-weight: 300; letter-spacing: -.01em; margin: 6px 0 18px; }
  .analyzing i { font-style: normal; animation: blink 1.4s infinite; }
  .analyzing i:nth-child(2) { animation-delay: .2s; } .analyzing i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .15; } 40% { opacity: 1; } }
  #trades { width: 100%; display: grid; gap: 20px; grid-template-columns: 1fr; }
  .trade { width: 100%; padding: 8px 0 4px; display: flex; flex-direction: column; align-items: center; }
  #trades.multi .trade { background: #121722; border: 1px solid var(--line); border-radius: 18px;
                         padding: 30px 26px 24px; }
  .sym { font-size: clamp(22px, 6.2vw, 28px); font-weight: 700; letter-spacing: .12em; color: var(--fg); }
  .sym em { font-style: normal; font-weight: 500; color: var(--muted); }
  .act { font-size: clamp(76px, 22vw, 128px); font-weight: 800; letter-spacing: -.035em; line-height: 1;
         margin: 12px 0 30px; }
  #trades.multi .act { font-size: clamp(68px, 19vw, 96px); margin: 10px 0 24px; }
  .act.BUY { color: var(--buy); } .act.SELL { color: var(--sell); }
  .levels { width: 100%; }
  .row { display: flex; justify-content: space-between; align-items: baseline; padding: 15px 2px;
         border-top: 1px solid var(--line); }
  .row:last-child { border-bottom: 1px solid var(--line); }
  #trades.multi .row:last-child { border-bottom: 0; }
  .row span { font-size: 13px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); }
  .row b { font-family: var(--mono); font-variant-numeric: tabular-nums; font-weight: 500;
           font-size: clamp(24px, 7vw, 32px); letter-spacing: -.01em; }
  .row.stop b { color: #F28B87; } .row.target b { color: #5CC8BC; }
  @media (min-width: 900px) {
    main.wide { max-width: 1180px; }
    #trades.n2 { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 28px; }
    #trades.n3, #trades.n4, #trades.n5 { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 28px; }
    #trades.multi .row b { font-size: 28px; }
    #trades.n1 .trade { background: #121722; border: 1px solid var(--line); border-radius: 22px;
                        padding: 40px 44px 30px; }
    #trades.n1 .row:last-child { border-bottom: 0; }
    #trades.n1 .act { font-size: 140px; }
    #trades.n1 .sym { font-size: 30px; }
  }
  .rr { margin-top: 16px; font-size: 13px; color: var(--muted); letter-spacing: .06em; }
  .next { margin-top: 48px; font-size: 13px; color: var(--muted); letter-spacing: .08em; }
  .next b { font-family: var(--mono); font-weight: 500; color: var(--fg); margin-left: 6px; }
  .quiet { margin-top: 40px; font-size: 13px; color: var(--faint); letter-spacing: .04em; line-height: 1.6; }
  .paused-note { font-size: 13px; color: var(--muted); letter-spacing: .08em; margin-bottom: 40px; }
  .view.out { opacity: 0; transition: opacity .6s ease; }
  .pausedBig { font-size: clamp(44px, 12vw, 72px); font-weight: 300; letter-spacing: -.02em; color: var(--amber);
               margin-bottom: 18px; }
  .notrade { font-size: clamp(44px, 12vw, 72px); font-weight: 300; letter-spacing: -.02em; color: var(--muted); }
</style>
</head>
<body>
<header>
  <div class="state" id="state"><span class="dot"></span><span id="stateText">—</span></div>
</header>

<main>
  <section class="view" id="v-countdown">
    <div class="eyebrow">Next signal in</div>
    <div class="count" id="count">--:--</div>
    <div class="sub" id="countAt"></div>
  </section>

  <section class="view" id="v-analyzing">
    <div class="eyebrow">Signal time</div>
    <div class="analyzing">Reading The Market<i>.</i><i>.</i><i>.</i></div>
  </section>

  <section class="view" id="v-signal">
    <div id="trades"></div>
    <div class="quiet" id="sigQuiet"></div>
  </section>

  <section class="view" id="v-paused">
    <div class="pausedBig">Paused</div>
    <div class="sub" id="pausedLast"></div>
  </section>
</main>


<script>
(() => {
  const SIGNAL_VISIBLE_MS = 18000;             // a new signal is shown for 18 s, then the countdown returns
  const POLL_MS = 3000;
  const ANALYZE_MAX_S = 270;     // after a boundary, show "Analyzing" until that cycle's signal arrives (max 4.5 min,
                                 // covers Gemini retries + GitHub Pages build/CDN delay); then back to countdown
  const OFFLINE_AFTER_S = 900;   // "Offline" only if status.json has not changed for 15 min (> 2 cycles + Pages delay)
  let status = null, sig = null, seenKey = null, showUntil = 0;
  const $ = id => document.getElementById(id);

  async function getJSON(path) {
    try {
      const r = await fetch(path + '?t=' + Date.now(), { cache: 'no-store' });
      return r.ok ? await r.json() : null;
    } catch { return null; }
  }
  async function poll() {
    const [s, l] = await Promise.all([getJSON('status.json'), getJSON('latest_signal.json')]);
    if (s) status = s;
    if (l) onSignal(l);
    render();
  }
  function onSignal(l) {
    const key = l.signal_at + '|' + (l.written_at || '');
    if (key === seenKey) return;
    const first = seenKey === null;
    seenKey = key; sig = l;
    if (first) {   // page load: do not replay an old signal; only show the remainder if it is < SIGNAL_VISIBLE_MS old
      const age = Date.now() - Date.parse(l.written_at || l.signal_at);
      showUntil = age >= 0 && age < SIGNAL_VISIBLE_MS ? Date.now() + (SIGNAL_VISIBLE_MS - age) : 0;
    } else {
      showUntil = Date.now() + SIGNAL_VISIBLE_MS;   // new cycle result: show it now for SIGNAL_VISIBLE_MS
    }
    const n = l.trades ? l.trades.length : 0;
    $('trades').innerHTML = n ? tradesHTML(l) : '<div class="notrade">No trade</div>';
    $('trades').className = 'n' + n + (n > 1 ? ' multi' : '');
    $('sigQuiet').textContent = n && l.no_trade && l.no_trade.length ? 'No trade · ' + l.no_trade.join(', ') : '';
  }

  const tz = () => (sig && sig.tz) || (status && status.tz) || undefined;
  const city = () => (tz() || '').split('/').pop().replace(/_/g, ' ');
  const hm = iso => new Intl.DateTimeFormat('en-GB', { timeZone: tz(), hour: '2-digit', minute: '2-digit' })
                     .format(new Date(iso));
  const dayhm = iso => new Intl.DateTimeFormat('en-GB', { timeZone: tz(), weekday: 'short', hour: '2-digit',
                     minute: '2-digit' }).format(new Date(iso));
  const mmss = s => { s = Math.max(0, Math.ceil(s)); const m = Math.floor(s / 60);
                      return String(m).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };
  const px = (v, d) => v == null ? '—' : Number(v).toLocaleString('en-US',
                     { minimumFractionDigits: d, maximumFractionDigits: d });

  // Clock-aligned schedule computed client-side (same rule as the loop), so the countdown ticks
  // even when status.json is stale or cached.
  function schedule(now) {
    const step = (status.interval_minutes || 5) * 60000, off = (status.align_offset_seconds || 0) * 1000;
    const prev = Math.floor((now - off) / step) * step + off;
    return { prev, next: prev + step };
  }
  function signalForCycle(prev) { return sig && Date.parse(sig.signal_at) >= prev - 10000; }

  function mode() {
    const now = Date.now();
    if (!status || status.state === 'paused' || status.state === 'stopped') return 'paused';
    if (now - Date.parse(status.updated_at) > OFFLINE_AFTER_S * 1000) return 'offline';
    const { prev } = schedule(now);
    const scheduled = status.state === 'analyzing' || Date.parse(status.next_run_at || 0) <= prev + 1000;
    if (scheduled && now - prev < ANALYZE_MAX_S * 1000 && !signalForCycle(prev)) return 'analyzing';
    return 'waiting';
  }

  function show(id) {
    for (const v of ['v-countdown', 'v-analyzing', 'v-signal', 'v-paused']) {
      const el = $(v), on = v === id;
      if (on && !el.classList.contains('on')) el.classList.remove('out');
      el.classList.toggle('on', on);
    }
  }

  function tradesHTML(l) {
    return l.trades.map(t => `
      <div class="trade">
        <div class="sym">${t.symbol}${t.name ? ` <em>· ${t.name}</em>` : ''}</div>
        <div class="act ${t.action}">${t.action}</div>
        <div class="levels">
          <div class="row"><span>Entry</span><b>${px(t.entry, t.digits)}</b></div>
          <div class="row stop"><span>Stop</span><b>${px(t.stop_loss, t.digits)}</b></div>
          <div class="row target"><span>Target</span><b>${px(t.take_profit, t.digits)}</b></div>
        </div>
        <div class="rr">R:R 1 : ${t.rr != null ? Number(t.rr).toFixed(2) : '—'}</div>
      </div>`).join('');
  }

  function render() {
    const m = mode(), live = m === 'waiting' || m === 'analyzing', now = Date.now();
    $('state').className = 'state ' + (live ? 'live' : 'paused');
    $('stateText').textContent = live ? 'Live' : (m === 'offline' ? 'Offline' : 'Paused');
    let view;
    if (!live) {
      view = 'v-paused';
      $('pausedLast').textContent = sig ? `Last signal · ${dayhm(sig.signal_at)} ${city()}` : '';
      document.querySelector('#v-paused .pausedBig').textContent = m === 'offline' ? 'Offline' : 'Paused';
    } else if (now < showUntil) {
      view = 'v-signal';
      $('v-signal').classList.toggle('out', showUntil - now < 600);   // fade out over the last 0.6 s
    } else if (m === 'analyzing') {
      view = 'v-analyzing';
    } else {
      view = 'v-countdown';
      const nxt = schedule(now).next;
      $('count').textContent = mmss((nxt - now) / 1000);
      $('countAt').textContent = `at ${hm(new Date(nxt).toISOString())} ${city()}`;
    }
    show(view);
    const n = sig && sig.trades ? sig.trades.length : 0;
    document.querySelector('main').classList.toggle('wide', view === 'v-signal' && n > 1);

  }

  poll();
  setInterval(poll, POLL_MS);
  setInterval(render, 100);
})();
</script>
</body>
</html>
